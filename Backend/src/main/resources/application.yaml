spring:
  application:
    name: travel-ai-planner

  # ==================== DATABASE ====================
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3636/travel_ai_planner}
    username: ${DBMS_USERNAME:root}
    password: ${DBMS_PASSWORD:lamdzbodoi}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: update          # tự tạo/cập nhật bảng khi chạy app
    show-sql: true              # in ra SQL để kiểm tra
    properties:
      hibernate:
        format_sql: true        # SQL đẹp hơn khi in
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.5-flash
          temperature: 0.7
          google-search-retrieval: false

  # ==================== DOCKER COMPOSE (chỉ dùng khi dev local) ====================
  docker:
    compose:
      enabled: true
      file: compose.yaml

  # ==================== MAIL SMTP ====================
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME:your-email@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ==================== SERVER ====================
server:
  port: 8080
  servlet:
    context-path: /travel-ai-planner

# ==================== JWT ====================
jwt:
  signerKey: "nH89dXg8G9QRuCdU8whHzp2F5fclyBtWyzfxTSaqMbsW6bqf4GUd3sBfNWP3/EW9O1gPMqJGBhn+tSrPdvdH6A=="
  access-token-expiration: 900000       # 15 phút (ms)
  refresh-token-expiration: 604800000   # 7 ngày (ms)

# ==================== CORS ====================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ==================== EXTERNAL APIs ====================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  api-key: ${CLOUDINARY_API_KEY:your-api-key}
  api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}

# ==================== SPRINGDOC / SWAGGER ====================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# ==================== LOGGING ====================
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    com.travelplanner: DEBUG
